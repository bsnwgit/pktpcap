<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ app_name }}</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #030712; color: #f9fafb;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-wrap {
    width: 380px;
  }
  .login-box {
    background: #111827; border: 1px solid #1f2937; border-radius: 16px; overflow: hidden;
  }
  .login-header {
    padding: 28px 32px 20px; border-bottom: 1px solid #1f2937; text-align: center;
  }
  .login-logo { height: 56px; width: auto; margin-bottom: 14px; }
  .login-title { font-size: 14px; font-weight: 600; color: #f9fafb; }
  .login-body { padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; }
  .field-label { font-size: 12px; font-weight: 500; color: #d1d5db; display: block; margin-bottom: 5px; }
  input[type="text"], input[type="password"] {
    width: 100%; background: #1f2937; border: 1px solid #374151; border-radius: 8px;
    padding: 9px 12px; color: #f9fafb; font-family: inherit; font-size: 13px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.2); }
  input::placeholder { color: #4b5563; }
  .btn-login {
    width: 100%; background: #2563eb; border: none; color: #fff;
    border-radius: 8px; padding: 10px; font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-login:hover { background: #3b82f6; }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-saml {
    width: 100%; background: #2563eb; border: none; color: #fff;
    border-radius: 8px; padding: 10px; font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    text-decoration: none;
  }
  .btn-saml:hover { background: #3b82f6; }
  .divider { display: flex; align-items: center; gap: 12px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #1f2937; }
  .divider span { font-size: 11px; color: #4b5563; white-space: nowrap; }
  .error-box {
    background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.2); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; color: #f87171; display: none;
  }
  .login-footer {
    text-align: center; margin-top: 16px; font-size: 11px; color: #4b5563;
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-header">
      <img src="/static/logo.png" alt="{{ app_name }}" class="login-logo">
      <p class="login-title">Sign in to {{ app_name }}</p>
    </div>
    <div class="login-body">

      {% if error %}
      <div class="error-box" style="display:block">{{ error }}</div>
      {% endif %}
      <div class="error-box" id="js-error"></div>

      {% if saml_enabled %}
      <a href="/api/auth/saml/login" class="btn-saml">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Sign in with Okta
      </a>
      {% if local_auth_enabled %}<div class="divider"><span>or</span></div>{% endif %}
      {% endif %}

      {% if local_auth_enabled %}
      <form id="login-form" onsubmit="submitLogin(event)">
        <div style="margin-bottom:14px">
          <label class="field-label" for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="username"
                 autocomplete="username" autofocus>
        </div>
        <div style="margin-bottom:20px">
          <label class="field-label" for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••"
                 autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login" id="login-btn">Sign In</button>
      </form>
      {% endif %}

    </div>
  </div>
  <p class="login-footer">{{ app_name }}</p>
</div>

<script>
async function submitLogin(e) {
  e.preventDefault()
  const btn = document.getElementById('login-btn')
  const box = document.getElementById('js-error')
  box.style.display = 'none'

  const username = document.getElementById('username').value.trim()
  const password = document.getElementById('password').value
  if (!username || !password) {
    box.textContent = 'Enter your username and password'
    box.style.display = 'block'
    return
  }

  btn.disabled = true
  btn.textContent = 'Signing in…'
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    })
    const result = await r.json()
    if (result.ok) {
      window.location.href = '/'
    } else {
      box.textContent = result.error || 'Sign in failed'
      box.style.display = 'block'
      btn.disabled = false
      btn.textContent = 'Sign In'
    }
  } catch(err) {
    box.textContent = 'Connection error — try again'
    box.style.display = 'block'
    btn.disabled = false
    btn.textContent = 'Sign In'
  }
}
</script>
</body>
</html>
